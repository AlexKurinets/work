<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#f3efe6"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#1c1814">
    <text x="48" y="56" font-size="28" font-weight="650">Orchestration workflow for a trade-indicator solution</text>
    <text x="48" y="90" font-size="16" fill="#5e584e">Readings come in. A person sends the action. The workflow does not.</text>

    <rect x="48" y="140" width="220" height="88" rx="8" fill="#fff" stroke="#1c1814"/>
    <text x="158" y="178" text-anchor="middle" font-size="16" font-weight="650">Indicator readings</text>
    <text x="158" y="202" text-anchor="middle" font-size="14" fill="#5e584e">Levels and signals</text>

    <rect x="308" y="140" width="220" height="88" rx="8" fill="#fff" stroke="#1c1814"/>
    <text x="418" y="178" text-anchor="middle" font-size="16" font-weight="650">Research and plan</text>
    <text x="418" y="202" text-anchor="middle" font-size="14" fill="#5e584e">Context before a draft</text>

    <rect x="568" y="140" width="220" height="88" rx="8" fill="#fff" stroke="#b8431f" stroke-width="2.5"/>
    <text x="678" y="178" text-anchor="middle" font-size="16" font-weight="650">Risk gate</text>
    <text x="678" y="202" text-anchor="middle" font-size="14" fill="#b8431f">Stays on</text>

    <rect x="828" y="140" width="180" height="88" rx="8" fill="#fff" stroke="#1c1814"/>
    <text x="918" y="178" text-anchor="middle" font-size="16" font-weight="650">Draft</text>
    <text x="918" y="202" text-anchor="middle" font-size="14" fill="#5e584e">Not an order</text>

    <rect x="1048" y="140" width="184" height="88" rx="8" fill="#1c1814"/>
    <text x="1140" y="178" text-anchor="middle" font-size="16" font-weight="650" fill="#f3efe6">A person</text>
    <text x="1140" y="202" text-anchor="middle" font-size="14" fill="#f3efe6">sends it</text>

    <rect x="48" y="300" width="1184" height="72" rx="8" fill="#1f6b4a"/>
    <text x="640" y="342" text-anchor="middle" font-size="18" font-weight="650" fill="#f3efe6">One route: readings, plan, risk check, draft, then a human send</text>

    <text x="48" y="440" font-size="18">The orchestrator only routes the request.</text>
    <text x="48" y="476" font-size="18">A failed risk check stops the draft.</text>
    <text x="48" y="512" font-size="18">Nothing in this workflow transmits an order.</text>
  </g>
</svg>
